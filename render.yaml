services:
  - type: web
    name: ssq-v6
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ssq-v6-db
          property: connectionString
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SEED_DRAWS_ON_STARTUP
        value: "true"
      - key: AUTO_SYNC_ON_STARTUP
        value: "false"
      - key: AUTO_SYNC_SOURCE
        value: "zhcw"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: ssq-v6-db
    plan: free
